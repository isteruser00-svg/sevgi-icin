<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 150px;
}

#kalp {
    font-size: 100px;
    cursor: pointer;
}

#yazi {
    display: none;
    font-size: 25px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="kalp">❤️</div>

<div id="yazi">Seni seviyorum ❤️</div>

<script>

document.getElementById("kalp").onclick = function() {
    document.getElementById("kalp").style.display = "none";
    document.getElementById("yazi").style.display = "block";
};

document.getElementById("yazi").onclick = function() {
    document.getElementById("yazi").innerHTML = "İyi ki varsın ❤️";
};

</script>

</body>
</html>
